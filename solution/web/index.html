<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Ops Advisor</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2b3442;
    --text: #e6edf3; --muted: #8b98a9; --accent: #4da3ff; --accent2: #7ee2b8;
    --pass: #2ea36b; --partial: #d29922; --error: #e5534b; --manual: #8957e5;
    --user: #1f3a5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
  }
  .badge.ok { color: var(--accent2); border-color: #2d4a3e; }
  .badge.err { color: var(--error); border-color: #5c2f2c; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  nav button.active { background: var(--panel2); color: var(--text); border-color: var(--border); }
  nav button:hover { color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .banner {
    background: #2d1f1e; border: 1px solid #5c2f2c; color: #f0b9b5;
    padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
  }

  /* cards */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card .id { font-weight: 600; color: var(--accent); font-family: ui-monospace, monospace; }
  .card .prompt { margin: 8px 0; }
  .tier { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .tier.t1 { background: #12324a; color: #79c0ff; }
  .tier.t2 { background: #3a2e12; color: #e3b341; }
  .tier.t3 { background: #3a1e4a; color: #d2a8ff; }
  .tier.sc { background: #143a2c; color: #7ee2b8; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
  pre {
    background: #0a0e14; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0 0;
    font-family: ui-monospace, "Cascadia Code", Menlo, monospace;
  }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #1f4470; border-color: #2b5c96; }
  .btn.primary:hover { background: #265589; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters .btn.on { border-color: var(--accent); color: var(--accent); }
  .explain { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .rules { margin-top: 6px; }
  .rule { font-size: 11px; font-family: ui-monospace, monospace; background: #21262d;
          border-radius: 6px; padding: 1px 7px; margin-right: 5px; color: var(--muted); }

  /* chat */
  #chatlog { min-height: 300px; max-height: calc(100vh - 300px); overflow-y: auto;
             padding: 4px; margin-bottom: 12px; }
  .msg { max-width: 85%; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px;
         white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--panel); border: 1px solid var(--border);
             border-bottom-left-radius: 4px; white-space: normal; }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.err { background: #2d1f1e; border: 1px solid #5c2f2c; color: #f0b9b5; }
  .toolchip {
    display: inline-block; font-size: 12px; font-family: ui-monospace, monospace;
    background: #1a2634; border: 1px solid #27405c; color: #79c0ff;
    border-radius: 999px; padding: 2px 10px; margin: 2px 4px 2px 0;
  }
  .toolchip.bad { border-color: #5c2f2c; color: #e5534b; }
  .toolrow { margin-bottom: 10px; max-width: 85%; }
  .typing { color: var(--muted); font-style: italic; margin-bottom: 12px; }
  #chatform { display: flex; gap: 8px; }
  #chatinput {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font: inherit; resize: vertical; min-height: 44px;
  }
  #chatinput:focus { outline: none; border-color: var(--accent); }

  /* eval */
  .evalbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  #evalids { background: var(--panel); color: var(--text); border: 1px solid var(--border);
             border-radius: 8px; padding: 7px 10px; font: inherit; width: 260px; }
  .progress { height: 8px; background: var(--panel2); border-radius: 999px; overflow: hidden;
              margin: 10px 0; }
  .progress > div { height: 100%; background: var(--accent); transition: width .4s; width: 0; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 8px 16px; text-align: center; min-width: 90px; }
  .stat b { display: block; font-size: 20px; }
  .stat.PASS b { color: var(--pass); } .stat.PARTIAL b { color: var(--partial); }
  .stat.ERROR b { color: var(--error); } .stat.MANUAL b { color: var(--manual); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border);
           font-size: 13px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 57px; background: var(--bg); }
  .st { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .st.PASS { background: #12351f; color: #56d364; }
  .st.PARTIAL { background: #3a2e12; color: #e3b341; }
  .st.ERROR { background: #3d1a17; color: #ff7b72; }
  .st.MANUAL { background: #2c1e42; color: #d2a8ff; }
  .miss { color: var(--partial); font-family: ui-monospace, monospace; font-size: 12px; }
  td .btn { padding: 2px 10px; font-size: 12px; }
  .muted { color: var(--muted); }
  code { background: #21262d; border-radius: 4px; padding: 1px 5px;
         font-family: ui-monospace, monospace; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Crew<span>Ops</span> Advisor</h1>
  <span class="badge" id="providerBadge">connecting…</span>
  <span class="badge" id="snapshotBadge"></span>
  <nav>
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="questions">Questions</button>
    <button data-tab="scenarios">Scenarios</button>
    <button data-tab="eval">Eval</button>
  </nav>
</header>
<main>
  <div id="banner" class="banner" style="display:none"></div>

  <section id="tab-chat" class="tab active">
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="btn" id="newchat">New chat</button>
    </div>
    <div id="chatlog">
      <div class="muted" id="chathint">Ask anything about the operation — e.g.
        “Who is on reserve at BLR tomorrow?” or “Captain C-1042 is sick for P-2291,
        what do I do?” — or pick a question/scenario from the other tabs.</div>
    </div>
    <form id="chatform">
      <textarea id="chatinput" rows="2" placeholder="Message the advisor… (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="btn primary" id="sendbtn" type="submit">Send</button>
    </form>
  </section>

  <section id="tab-questions" class="tab">
    <div class="filters" id="qfilters">
      <button class="btn on" data-tier="all">All</button>
      <button class="btn" data-tier="1">Tier 1</button>
      <button class="btn" data-tier="2">Tier 2</button>
      <button class="btn" data-tier="3">Tier 3</button>
    </div>
    <div id="qlist"></div>
  </section>

  <section id="tab-scenarios" class="tab">
    <div id="slist"></div>
  </section>

  <section id="tab-eval" class="tab">
    <div class="evalbar">
      <button class="btn primary" data-run="all">Run full eval</button>
      <button class="btn" data-run="t1">Tier 1</button>
      <button class="btn" data-run="t2">Tier 2</button>
      <button class="btn" data-run="t3">Tier 3</button>
      <button class="btn" data-run="sc">Scenarios</button>
      <input id="evalids" placeholder="or ids: Q01 Q05 S2">
      <button class="btn" data-run="ids">Run ids</button>
      <span class="muted" id="evalnote"></span>
    </div>
    <div class="progress" id="evalprog" style="display:none"><div></div></div>
    <div class="summary" id="evalsummary"></div>
    <div style="overflow-x:auto">
      <table id="evaltable" style="display:none">
        <thead><tr>
          <th>Item</th><th>Status</th><th>Atoms</th><th>Tools</th><th>Time</th>
          <th>Missing atoms</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="evaldetail"></div>
  </section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// minimal markdown: bold, code, paragraphs/line breaks
function md(s) {
  return esc(s).split(/\n{2,}/).map(p =>
    "<p>" + p
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\n/g, "<br>") + "</p>").join("");
}

let META = null, DATA = null;
let sessionId = crypto.randomUUID();

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(name) {
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.id === "tab-" + name));
  if (name === "eval") pollEval();
}

/* ---------- boot ---------- */
async function boot() {
  META = await (await fetch("/api/meta")).json();
  const pb = $("#providerBadge");
  if (META.provider) {
    pb.textContent = `AI: ${META.provider} · ${META.model}`;
    pb.className = "badge ok";
  } else {
    pb.textContent = "AI layer not configured";
    pb.className = "badge err";
    $("#banner").style.display = "";
    $("#banner").textContent = META.error +
      " — you can still browse questions and scenarios.";
  }
  $("#snapshotBadge").textContent = "snapshot now: " + META.snapshot_now;
  DATA = await (await fetch("/api/dataset")).json();
  renderQuestions("all");
  renderScenarios();
  pollEval();
}
boot();

/* ---------- questions ---------- */
$("#qfilters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#qfilters .btn").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  renderQuestions(b.dataset.tier);
});

function renderQuestions(tier) {
  const list = DATA.questions.filter(q => tier === "all" || String(q.tier) === tier);
  $("#qlist").innerHTML = list.map(q => `
    <div class="card">
      <div class="head">
        <span class="id">${q.question_id}</span>
        <span class="tier t${q.tier}">Tier ${q.tier}</span>
        <span style="margin-left:auto"></span>
        <button class="btn primary" onclick="testInChat('${q.question_id}')">Test in chat</button>
      </div>
      <div class="prompt">${esc(q.prompt)}</div>
      <div class="explain">${esc(q.explanation)}</div>
      <div class="rules">${(q.rules_ref||[]).map(r => `<span class="rule">${esc(r)}</span>`).join("")}</div>
      <details><summary>Expected answer</summary><pre>${esc(JSON.stringify(q.expected_answer, null, 1))}</pre></details>
    </div>`).join("");
}

/* ---------- scenarios ---------- */
function renderScenarios() {
  $("#slist").innerHTML = DATA.scenarios.map(s => `
    <div class="card">
      <div class="head">
        <span class="id">${s.scenario_id}</span>
        <span class="tier sc">${esc(s.difficulty)}</span>
        <b>${esc(s.title)}</b>
        <span style="margin-left:auto"></span>
        <button class="btn primary" onclick="testInChat('${s.scenario_id}')">Test in chat</button>
      </div>
      <div class="prompt">${esc(s.event.narrative)}</div>
      <details><summary>Event JSON</summary><pre>${esc(JSON.stringify(s.event, null, 1))}</pre></details>
      <details><summary>Answer key</summary><pre>${esc(JSON.stringify(s.answer_key, null, 1))}</pre></details>
    </div>`).join("");
}

function promptFor(id) {
  const q = DATA.questions.find(q => q.question_id === id);
  if (q) return q.prompt;
  const s = DATA.scenarios.find(s => s.scenario_id === id);
  return s ? s.prompt : null;
}

function testInChat(id) {
  const p = promptFor(id);
  if (!p) return;
  showTab("chat");
  sendMessage(p);
}

/* ---------- chat ---------- */
$("#newchat").onclick = async () => {
  await fetch("/api/chat/reset", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sessionId})});
  sessionId = crypto.randomUUID();
  $("#chatlog").innerHTML = '<div class="muted">New conversation started.</div>';
};

$("#chatform").onsubmit = e => {
  e.preventDefault();
  const text = $("#chatinput").value.trim();
  if (text) { $("#chatinput").value = ""; sendMessage(text); }
};
$("#chatinput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("#chatform").requestSubmit();
  }
});

function chatAppend(html) {
  const log = $("#chatlog");
  const hint = $("#chathint"); if (hint) hint.remove();
  log.insertAdjacentHTML("beforeend", html);
  log.scrollTop = log.scrollHeight;
  return log.lastElementChild;
}

async function sendMessage(text) {
  if ($("#sendbtn").disabled) return;
  $("#sendbtn").disabled = true;
  chatAppend(`<div class="msg user">${esc(text)}</div>`);
  const toolrow = chatAppend(`<div class="toolrow"></div>`);
  const typing = chatAppend(`<div class="typing">advisor is thinking…</div>`);
  try {
    const resp = await fetch("/api/chat", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sessionId, message: text})});
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({error: resp.statusText}));
      throw new Error(err.error || resp.statusText);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (line.trim()) handleChatEvent(JSON.parse(line), toolrow);
      }
    }
  } catch (e) {
    chatAppend(`<div class="msg err">${esc(e.message)}</div>`);
  } finally {
    typing.remove();
    if (!toolrow.children.length) toolrow.remove();
    $("#sendbtn").disabled = false;
    $("#chatinput").focus();
  }
}

function handleChatEvent(ev, toolrow) {
  if (ev.type === "tool_call") {
    toolrow.insertAdjacentHTML("beforeend",
      `<span class="toolchip" title="${esc(JSON.stringify(ev.args))}">→ ${esc(ev.name)}</span>`);
    $("#chatlog").scrollTop = $("#chatlog").scrollHeight;
  } else if (ev.type === "tool_result" && !ev.ok) {
    const chips = toolrow.querySelectorAll(".toolchip");
    if (chips.length) chips[chips.length - 1].classList.add("bad");
  } else if (ev.type === "error") {
    chatAppend(`<div class="msg err">${esc(ev.error)}</div>`);
  } else if (ev.type === "answer") {
    let traceHtml = "";
    if (ev.trace && ev.trace.length) {
      traceHtml = `<details><summary>${ev.trace.length} tool call${ev.trace.length > 1 ? "s" : ""} — full results</summary>` +
        ev.trace.map(t => `<pre><b>${esc(t.name)}</b>\n${esc(JSON.stringify(t.result, null, 1))}</pre>`).join("") +
        `</details>`;
    }
    chatAppend(`<div class="msg bot">${md(ev.answer)}${traceHtml}</div>`);
  }
}

/* ---------- eval ---------- */
let evalTimer = null;

document.querySelectorAll("[data-run]").forEach(b => b.onclick = () => startEval(b.dataset.run));

function idsFor(kind) {
  if (kind === "all") return [];
  if (kind === "sc") return DATA.scenarios.map(s => s.scenario_id);
  if (kind === "ids")
    return $("#evalids").value.trim().split(/[\s,]+/).filter(Boolean).map(s => s.toUpperCase());
  const tier = Number(kind.slice(1));
  return DATA.questions.filter(q => q.tier === tier).map(q => q.question_id);
}

async function startEval(kind) {
  const ids = idsFor(kind);
  if (kind === "ids" && !ids.length) return;
  const resp = await fetch("/api/eval/start", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ids})});
  const body = await resp.json();
  if (body.error) { $("#evalnote").textContent = body.error; return; }
  $("#evalnote").textContent = "";
  $("#evaltable tbody").innerHTML = "";
  $("#evaldetail").innerHTML = "";
  pollEval(true);
}

async function pollEval(force) {
  if (evalTimer) { clearTimeout(evalTimer); evalTimer = null; }
  const st = await (await fetch("/api/eval/status")).json();
  renderEval(st);
  if (st.running) evalTimer = setTimeout(() => pollEval(), 2500);
}

function renderEval(st) {
  document.querySelectorAll("[data-run]").forEach(b => b.disabled = st.running);
  const prog = $("#evalprog");
  if (st.running && st.total) {
    prog.style.display = "";
    prog.firstElementChild.style.width = (100 * st.results.length / st.total) + "%";
    $("#evalnote").textContent = `running ${st.results.length}/${st.total} — ${st.provider} · ${st.model}`;
  } else {
    prog.style.display = "none";
    if (st.error) $("#evalnote").textContent = st.error;
    else if (st.results.length)
      $("#evalnote").textContent =
        (st.saved ? "last saved run — " : "finished — ") + `${st.provider} · ${st.model}`;
  }
  if (!st.results.length) { $("#evaltable").style.display = "none"; $("#evalsummary").innerHTML = ""; return; }

  const counts = {PASS: 0, PARTIAL: 0, MANUAL: 0, ERROR: 0};
  let atoms = 0, found = 0;
  for (const r of st.results) {
    counts[r.status] = (counts[r.status] || 0) + 1;
    if (r.status === "PASS" || r.status === "PARTIAL") { atoms += r.atoms; found += r.found; }
  }
  const cov = atoms ? (100 * found / atoms).toFixed(1) + "%" : "—";
  $("#evalsummary").innerHTML =
    Object.entries(counts).filter(([, n]) => n)
      .map(([k, n]) => `<div class="stat ${k}"><b>${n}</b>${k}</div>`).join("") +
    `<div class="stat"><b>${cov}</b>atom coverage</div>`;

  $("#evaltable").style.display = "";
  $("#evaltable tbody").innerHTML = st.results.map((r, i) => `
    <tr>
      <td class="id">${esc(r.id)}</td>
      <td><span class="st ${r.status}">${r.status}</span></td>
      <td>${r.found}/${r.atoms}</td>
      <td>${r.tool_calls}</td>
      <td>${r.seconds}s</td>
      <td class="miss">${esc((r.missing || []).slice(0, 6).join(", "))}${(r.missing||[]).length > 6 ? "…" : ""}</td>
      <td><button class="btn" onclick="showEvalDetail(${i})">answer</button></td>
    </tr>`).join("");
  window._evalResults = st.results;
}

function showEvalDetail(i) {
  const r = window._evalResults[i];
  $("#evaldetail").innerHTML = `
    <div class="card">
      <div class="head"><span class="id">${esc(r.id)}</span>
        <span class="st ${r.status}">${r.status}</span>
        <span style="margin-left:auto"></span>
        <button class="btn" onclick="testInChat('${esc(r.id)}')">Re-test in chat</button>
      </div>
      <div class="explain">${esc(r.prompt)}</div>
      ${r.error ? `<pre>${esc(r.error)}</pre>` : `<div class="msg bot" style="max-width:none;margin-top:10px">${md(r.answer)}</div>`}
      ${(r.missing||[]).length ? `<details open><summary>Missing atoms (${r.missing.length})</summary><pre>${esc(r.missing.join("\n"))}</pre></details>` : ""}
    </div>`;
  $("#evaldetail").scrollIntoView({behavior: "smooth"});
}
</script>
</body>
</html>
